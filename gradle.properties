org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

minecraft_version=1.21.11
loader_version=0.18.4
fabric_version=0.141.6+1.21.11

# Architectury: one build, a common module and one module per loader (no Architectury API at runtime)
architectury_plugin_version=3.4-SNAPSHOT
architectury_loom_version=1.13-SNAPSHOT
shadow_version=9.3.0
# the loaders built by default; -Penabled_platforms=fabric skips NeoForge's setup
enabled_platforms=fabric,neoforge
neoforge_version=21.11.48
# must be the event bus NeoForge above uses (Wynntils' events run on it on both loaders)
neoforge_eventbus_version=8.0.5

mod_version=0.1.0
maven_group=io.github.anilken.wynnlabs
archives_base_name=wynnlabs
# the Wynntils jar compiled against (libs/); -PwynntilsJar=<path> overrides it
wynntils_version=4.2.13
# the Wynntils versions Wynn Labs loads with, as a Maven range; both loaders' metadata come from it
wynntils_range=[4.1.0,5.0.0)
