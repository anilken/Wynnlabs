// The NeoForge jar: the entrypoint, NeoForgePlatform and neoforge.mods.toml here, everything
// else from common. Left out with -Penabled_platforms=fabric (settings.gradle).
plugins {
    id 'com.gradleup.shadow' version "${shadow_version}"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

loom {
    accessWidenerPath = project(':common').loom.accessWidenerPath
}

base {
    archivesName = "${rootProject.archives_base_name}-neoforge"
}

repositories {
    maven { url = 'https://maven.neoforged.net/releases' }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive = false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive = false }
}

processResources {
    def props = [version          : project.version,
                 minecraft_version: rootProject.minecraft_version,
                 neoforge_version : rootProject.neoforge_version,
                 wynntils_range   : rootProject.wynntils_range]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

shadow {
    addShadowVariantIntoJavaComponent = false
}

// jars (D7): the player jar is build/libs/wynnlabs-neoforge-<version>.jar
jar {
    archiveClassifier = 'dev'
}

shadowJar {
    exclude 'fabric.mod.json'
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    // common's access widener, as NeoForge's access transformer
    atAccessWideners.add loom.accessWidenerPath.get().asFile.name
    archiveClassifier = null
}
